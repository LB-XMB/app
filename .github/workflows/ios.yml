name: iOS

# Forgejo has no macOS runner, and building for iOS requires Xcode. This
# workflow therefore runs on the GitHub mirror, where macOS runners are free,
# and produces an unsigned IPA meant to be sideloaded (AltStore, SideStore,
# TrollStore) or re-signed locally with Sideloadly.
#
# The IPA is published on the GitHub release of the same tag. The Forgejo
# pipeline then downloads it from there and attaches it to its own release,
# which avoids sending anything from this runner to git.lbxmb.fr.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 1.0.2"
        required: true

jobs:
  ipa:
    # Forgejo also reads .github/workflows; this keeps it from queueing a job
    # for a runner label that does not exist there.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: meta
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a semantic version, got $VERSION" >&2; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the release version
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        run: npx pod-install

      - name: Show the toolchain
        run: xcodebuild -version

      - name: Build without signing
        run: |
          set -eu
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Workspace: $WORKSPACE / scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tail -40

      - name: Package the IPA
        id: package
        run: |
          set -eu
          APP="$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)"
          NAME="lbxmb_${{ steps.meta.outputs.version }}_ios-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "$NAME" Payload
          shasum -a 256 "$NAME" > "$NAME.sha256"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Keep the IPA as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

      # Handing the file over through the GitHub release lets the Forgejo runner
      # pull it from its own network, instead of pushing it across from here.
      - name: Publish the IPA on the GitHub release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.package.outputs.name }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          set -eu
          NOTES="IPA non signée, à installer avec AltStore, SideStore, TrollStore ou Sideloadly."
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A prior cancelled run may have left a draft; undraft so Forgejo
            # can fetch /releases/download/... without auth.
            gh release edit "$TAG" --draft=false --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
          gh release edit "$TAG" --draft=false
          echo "Published $NAME on the $TAG release."
