name: Release

# Builds run on tags only. Push a tag such as v1.0.1 to cut a release:
# the version number is derived from the tag, never committed by hand.
#
# The IPA is produced separately by .github/workflows/ios.yml, on the GitHub
# mirror, because signing for iOS requires a macOS machine.
on:
  push:
    tags:
      - "v*"

env:
  NODE_IMAGE: node:22-bookworm

jobs:
  release:
    runs-on: docker
    container:
      image: node:22-bookworm
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # Whoever owns the token that calls the API becomes the author of the
      # release. The automatic GITHUB_TOKEN of Actions has no user behind it,
      # so releases created with it are attributed to Ghost. RELEASER_TOKEN is a
      # personal access token, which is what puts a real name on the release.
      - name: Check the release token
        env:
          TOKEN: ${{ secrets.RELEASER_TOKEN }}
        run: |
          set -eu
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::RELEASER_TOKEN is missing. Create a personal access token on"
            echo "::error::$GITHUB_SERVER_URL/user/settings/applications with the"
            echo "::error::write:repository scope, then add it to this repository as a"
            echo "::error::secret named RELEASER_TOKEN."
            exit 1
          fi
          WHO="$(curl -sS "$GITHUB_SERVER_URL/api/v1/user" \
            -H "Authorization: token $TOKEN" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                try { console.log(JSON.parse(d).login ?? ""); } catch { console.log(""); }
              })')"
          if [ -z "$WHO" ]; then
            echo "::error::RELEASER_TOKEN was rejected by $GITHUB_SERVER_URL."
            exit 1
          fi
          echo "Releases will be authored by $WHO."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: meta
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag $TAG is not a semantic version (expected vX.Y.Z)" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          set -eu
          TAG="${{ steps.meta.outputs.tag }}"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"

          # Previous *distinct* version tag by semver. Skip tags that point at the
          # same commit (retags / cancelled builds), otherwise git describe-style
          # ranges jump over them and dump every CI commit since an older release.
          PREVIOUS=""
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if [ "$(git rev-list -n 1 "$candidate")" != "$TAG_COMMIT" ]; then
              PREVIOUS="$candidate"
              break
            fi
          done <<EOF
          $(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$TAG" || true)
          EOF

          {
            if [ -n "$PREVIOUS" ]; then
              echo "## Changements depuis $PREVIOUS"
              echo
              # Drop CI / store plumbing from the public changelog.
              COMMITS="$(
                git log --no-merges --pretty='%s' "$PREVIOUS..$TAG" 2>/dev/null \
                  | grep -Ev \
                    -e 'Android CI' \
                    -e 'Obtainium' \
                    -e 'registry' \
                    -e 'Docker Hub' \
                    -e 'sdkmanager|pre-cuite|arm64 seul' \
                    -e 'SideStore' \
                  || true
              )"
              if [ -n "$COMMITS" ]; then
                printf '%s\n' "$COMMITS" | sed 's/^/- /'
              else
                echo "_Aucun changement applicatif depuis $PREVIOUS._"
              fi
            else
              echo "## Première version"
            fi

            cat <<'NOTES'

          ### Installation

          - **Android** : télécharger le `.apk`, puis autoriser l'installation depuis cette source.
          - **iOS** : le `.ipa` n'est pas signé, il s'installe avec AltStore, SideStore,
            TrollStore ou Sideloadly.
          NOTES
          } > notes.md

          cat notes.md

      - name: Create or reuse the Forgejo release
        id: release
        env:
          TOKEN: ${{ secrets.RELEASER_TOKEN }}
        run: |
          set -eu
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
          TAG="${{ steps.meta.outputs.tag }}"

          BODY="$(node -e '
            const fs = require("node:fs");
            process.stdout.write(JSON.stringify({
              tag_name: process.argv[1],
              name: process.argv[1],
              body: fs.readFileSync("notes.md", "utf8"),
              draft: false,
              prerelease: false,
            }));
          ' "$TAG")"

          ID="$(curl -sS -X POST "$API" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
              try {
                const j = JSON.parse(d);
                if (typeof j.id === "number") return console.log(j.id);
              } catch {}
              console.log("");
            })')"

          if [ -z "$ID" ]; then
            echo "Release already exists, reusing it."
            ID="$(curl -sS "$API/tags/$TAG" -H "Authorization: token $TOKEN" \
              | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                  try {
                    const j = JSON.parse(d);
                    if (typeof j.id === "number") return console.log(j.id);
                  } catch {}
                  console.log("");
                })')"
          fi

          if ! [[ "$ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Impossible de créer ou récupérer la release $TAG (réponse API invalide)."
            exit 1
          fi

          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Release id: $ID"

  android:
    needs: release
    runs-on: docker
    # JDK + SDK + NDK baked image (ci/android-builder/).
    # Docker Hub so every Forgejo runner can pull it.
    # Rebuild+push: ./ci/android-builder/build.sh
    # Do NOT mount volumes via container.options unless the runner
    # config lists them under container.valid_volumes (empty = reject).
    container:
      image: interverti/android-builder:sdk36-ndk27
    env:
      APP_VERSION: ${{ needs.release.outputs.version }}
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      # Sideload / Obtainium: arm64-only halves native compile time vs dual-ABI.
      ARCHITECTURES: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the Android toolchain
        run: |
          set -eu
          java -version
          node -v
          test -d "$ANDROID_HOME/ndk/27.1.12297006"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Install dependencies
        run: npm ci

      - name: Apply the release version
        run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble the release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=$ARCHITECTURES --no-daemon

      - name: Sign with the release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -z "${KEYSTORE:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK keeps its"
            echo "::warning::development signature. Fine for sideloading, not for Play."
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > /tmp/release.jks
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "env:KEY_PASSWORD" \
            "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -4
          rm -f /tmp/release.jks

      - name: Upload the APK to the release
        env:
          TOKEN: ${{ secrets.RELEASER_TOKEN }}
        run: |
          set -eu
          NAME="lbxmb_${APP_VERSION}_android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.release_id }}/assets"
          for FILE in "$NAME" "$NAME.sha256"; do
            curl -sS --fail-with-body -X POST "$API?name=$FILE" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$FILE" > /dev/null
            echo "Uploaded $FILE"
          done

  # The IPA is built by .github/workflows/ios.yml on a macOS runner and lands on
  # the GitHub release. This job brings it back here. It waits for the Android
  # build first, which gives the macOS job the fifteen minutes it needs.
  ios:
    needs: [release, android]
    runs-on: docker
    container:
      image: node:22-bookworm
    env:
      APP_VERSION: ${{ needs.release.outputs.version }}
      MIRROR: https://github.com/LB-XMB/app
    steps:
      - name: Fetch the IPA from the GitHub mirror
        run: |
          set -eu
          NAME="lbxmb_${APP_VERSION}_ios-unsigned.ipa"
          BASE="$MIRROR/releases/download/v$APP_VERSION"

          for FILE in "$NAME" "$NAME.sha256"; do
            DOWNLOADED=no
            for attempt in $(seq 1 40); do
              CODE="$(curl -sL --max-time 600 -o "$FILE" -w '%{http_code}' "$BASE/$FILE")"
              if [ "$CODE" = "200" ]; then
                DOWNLOADED=yes
                echo "Got $FILE after $attempt attempt(s)."
                break
              fi
              rm -f "$FILE"
              echo "$FILE is not published yet (HTTP $CODE), waiting."
              sleep 30
            done
            if [ "$DOWNLOADED" = "no" ]; then
              echo "::error::The macOS build never published $FILE."
              exit 1
            fi
          done

          sha256sum -c "$NAME.sha256"
          ls -lh "$NAME"

      - name: Upload the IPA to the release
        env:
          TOKEN: ${{ secrets.RELEASER_TOKEN }}
        run: |
          set -eu
          NAME="lbxmb_${APP_VERSION}_ios-unsigned.ipa"
          API="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.release_id }}/assets"
          for FILE in "$NAME" "$NAME.sha256"; do
            curl -sS --fail-with-body -X POST "$API?name=$FILE" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$FILE" > /dev/null
            echo "Uploaded $FILE"
          done
          # Survive the following checkout (workspace is replaced).
          cp "$NAME" "/tmp/$NAME"

      - name: Checkout main for SideStore
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASER_TOKEN }}

      - name: Publish SideStore source on main
        env:
          TOKEN: ${{ secrets.RELEASER_TOKEN }}
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -eu
          NAME="lbxmb_${APP_VERSION}_ios-unsigned.ipa"
          if [ ! -f "/tmp/$NAME" ]; then
            echo "::error::IPA missing at /tmp/$NAME after checkout."
            exit 1
          fi

          NOTES="$(curl -sS "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/tags/v$APP_VERSION" \
            -H "Authorization: token $TOKEN" \
            | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c)).on("end", () => {
                try {
                  const body = String(JSON.parse(d).body || "");
                  const line = body
                    .split(/\r?\n/)
                    .map((l) => l.trim())
                    .find((l) => l.startsWith("- "));
                  process.stdout.write(line ? line.slice(2).trim() : "");
                } catch {
                  process.stdout.write("");
                }
              });
            ')"
          if [ -z "$NOTES" ]; then
            NOTES="Version $APP_VERSION."
          fi

          git fetch origin main
          git checkout -B main origin/main

          node tools/update-sidestore.cjs \
            --version "$APP_VERSION" \
            --ipa "/tmp/$NAME" \
            --notes "$NOTES"

          if git diff --quiet -- store/sidestore.json; then
            echo "SideStore source already lists $APP_VERSION."
            exit 0
          fi

          git add store/sidestore.json
          # CI bot identity — no Cursor trailer on automated SideStore bumps.
          GIT_AUTHOR_NAME="Forgejo Actions" GIT_AUTHOR_EMAIL="actions@git.lbxmb.fr" \
          GIT_COMMITTER_NAME="Forgejo Actions" GIT_COMMITTER_EMAIL="actions@git.lbxmb.fr" \
          git commit -m "$(cat <<EOF
Met à jour SideStore pour la version $APP_VERSION.

EOF
)"

          HOST="${GITHUB_SERVER_URL#https://}"
          git push "https://oauth2:${TOKEN}@${HOST}/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "Pushed store/sidestore.json with $APP_VERSION."
